<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="dl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="dl-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="dl-cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <radialGradient id="dl-glow" cx="42%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded App Icon Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#dl-bg)" stroke="url(#dl-lens)" stroke-width="2.5" />
  <circle cx="27" cy="27" r="20" fill="url(#dl-glow)" />

  <!-- Magnifying Glass Handle -->
  <path d="M40.5 40.5L53 53" stroke="url(#dl-lens)" stroke-width="6" stroke-linecap="round" />
  <path d="M41.5 41.5L51.5 51.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Magnifying Glass Outer Lens Ring -->
  <circle cx="27" cy="27" r="18" fill="#0f172a" fill-opacity="0.75" stroke="url(#dl-lens)" stroke-width="4" />

  <!-- Shopping Cart Inside the Lens -->
  <path
    d="M16.5 20.5H19.5L21.8 30.2C22.05 31.25 22.98 32 24.06 32H33.4C34.38 32 35.24 31.36 35.55 30.42L37.8 23.5H20.4"
    stroke="url(#dl-cart)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Cart Price Trend / Deal Check Line inside basket -->
  <path
    d="M24 27.5L26.8 29.8L32.5 24.5"
    stroke="#10b981"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Cart Wheels -->
  <circle cx="24.5" cy="36" r="2.2" fill="#10b981" />
  <circle cx="33" cy="36" r="2.2" fill="#06b6d4" />

  <!-- Lens Deal Spark Accent -->
  <path
    d="M38 12L39.1 14.9L42 16L39.1 17.1L38 20L36.9 17.1L34 16L36.9 14.9L38 12Z"
    fill="#10b981"
  />
</svg>