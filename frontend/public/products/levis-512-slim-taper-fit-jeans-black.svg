<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="bg_Fashion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow_Fashion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="shadow_Fashion">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" rx="12" fill="url(#bg_Fashion)"/>
  <rect width="400" height="350" rx="12" fill="url(#glow_Fashion)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="50" y1="0" x2="50" y2="350"/><line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/><line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/><line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
  </g>

  <!-- Category icon -->
  <g filter="url(#shadow_Fashion)">
    <path d="M160 120 L200 100 L240 120 L260 140 L240 150 L235 260 L165 260 L160 150 L140 140 Z" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="3"/>
      <line x1="200" y1="100" x2="200" y2="260" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
      <path d="M160 120 L200 140 L240 120" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Brand name -->
  <text x="200" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6366f1" letter-spacing="3" opacity="0.9">LEVI'S</text>

  <!-- Product name -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" opacity="0.8">Levi's 512 Slim Taper</text>

  <!-- Category badge -->
  <rect x="140" y="318" width="120" height="20" rx="10" fill="#6366f1" opacity="0.1"/>
  <text x="200" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6366f1" opacity="0.7">FASHION</text>

  <!-- ShopSmart branding -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#475569" opacity="0.4">SHOPSMART</text>
</svg>