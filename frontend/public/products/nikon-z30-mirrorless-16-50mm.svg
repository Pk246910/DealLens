<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="bg_Cameras" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow_Cameras" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="shadow_Cameras">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f97316" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" rx="12" fill="url(#bg_Cameras)"/>
  <rect width="400" height="350" rx="12" fill="url(#glow_Cameras)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#f97316" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="50" y1="0" x2="50" y2="350"/><line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/><line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/><line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
  </g>

  <!-- Category icon -->
  <g filter="url(#shadow_Cameras)">
    <rect x="120" y="110" width="160" height="110" rx="10" fill="none" stroke="#f97316" stroke-width="4"/>
      <circle cx="200" cy="165" r="35" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="3"/>
      <circle cx="200" cy="165" r="22" fill="none" stroke="#f97316" stroke-width="2"/>
      <circle cx="200" cy="165" r="10" fill="#f97316" opacity="0.3"/>
      <rect x="240" y="115" width="30" height="16" rx="4" fill="#f97316" opacity="0.2"/>
      <rect x="135" y="100" width="40" height="14" rx="4" fill="#f97316" opacity="0.2"/>
  </g>

  <!-- Brand name -->
  <text x="200" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f97316" letter-spacing="3" opacity="0.9">NIKON</text>

  <!-- Product name -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" opacity="0.8">Nikon Z30 Mirrorless 16-50mm</text>

  <!-- Category badge -->
  <rect x="140" y="318" width="120" height="20" rx="10" fill="#f97316" opacity="0.1"/>
  <text x="200" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#f97316" opacity="0.7">CAMERAS</text>

  <!-- DealLens branding -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#475569" opacity="0.4">DEALLENS</text>
</svg>