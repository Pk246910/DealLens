<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="bg_Earbuds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow_Earbuds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="shadow_Earbuds">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" rx="12" fill="url(#bg_Earbuds)"/>
  <rect width="400" height="350" rx="12" fill="url(#glow_Earbuds)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#f43f5e" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="50" y1="0" x2="50" y2="350"/><line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/><line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/><line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
  </g>

  <!-- Category icon -->
  <g filter="url(#shadow_Earbuds)">
    <ellipse cx="170" cy="180" rx="28" ry="30" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="3"/>
      <ellipse cx="230" cy="180" rx="28" ry="30" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="3"/>
      <circle cx="170" cy="178" r="8" fill="#f43f5e" opacity="0.5"/>
      <circle cx="230" cy="178" r="8" fill="#f43f5e" opacity="0.5"/>
      <path d="M170 210 Q170 240 160 260" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4"/>
      <path d="M230 210 Q230 240 240 260" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Brand name -->
  <text x="200" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f43f5e" letter-spacing="3" opacity="0.9">BOAT</text>

  <!-- Product name -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" opacity="0.8">Boat Airdopes 141 TWS</text>

  <!-- Category badge -->
  <rect x="140" y="318" width="120" height="20" rx="10" fill="#f43f5e" opacity="0.1"/>
  <text x="200" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#f43f5e" opacity="0.7">EARBUDS</text>

  <!-- DealLens branding -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#475569" opacity="0.4">DEALLENS</text>
</svg>