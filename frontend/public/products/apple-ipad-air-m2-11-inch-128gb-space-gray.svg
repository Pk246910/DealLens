<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="bg_Tablets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow_Tablets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="shadow_Tablets">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" rx="12" fill="url(#bg_Tablets)"/>
  <rect width="400" height="350" rx="12" fill="url(#glow_Tablets)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="50" y1="0" x2="50" y2="350"/><line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/><line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/><line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
  </g>

  <!-- Category icon -->
  <g filter="url(#shadow_Tablets)">
    <rect x="130" y="80" width="140" height="190" rx="12" fill="none" stroke="#3b82f6" stroke-width="4"/>
      <rect x="140" y="92" width="120" height="160" rx="4" fill="#3b82f6" opacity="0.15"/>
      <circle cx="200" cy="264" r="4" fill="#3b82f6" opacity="0.5"/>
  </g>

  <!-- Brand name -->
  <text x="200" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3b82f6" letter-spacing="3" opacity="0.9">APPLE</text>

  <!-- Product name -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" opacity="0.8">Apple iPad Air M2</text>

  <!-- Category badge -->
  <rect x="140" y="318" width="120" height="20" rx="10" fill="#3b82f6" opacity="0.1"/>
  <text x="200" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#3b82f6" opacity="0.7">TABLETS</text>

  <!-- DealLens branding -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#475569" opacity="0.4">DEALLENS</text>
</svg>